
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Reset your PracCode account password.">

    <title>Forgot Password | PracCode</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Global Styles -->
    <link rel="stylesheet" href="../style.css">

    <!-- Authentication Styles -->
    <link rel="stylesheet" href="../css/authentication.css">

    <style>
        .forgot-password-card {
            width: 100%;
            max-width: 460px;
            margin: 60px auto;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .forgot-icon {
            width: 65px;
            height: 65px;
            display: grid;
            place-items: center;
            margin: 0 auto 22px;
            border-radius: 18px;
            background: rgba(108, 99, 255, 0.15);
            font-size: 30px;
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .forgot-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .forgot-header p {
            color: var(--color-text-muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .forgot-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .forgot-form label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .forgot-form input {
            width: 100%;
            padding: 14px 15px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--color-text);
            outline: none;
            transition: 0.3s ease;
        }

        .forgot-form input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.12);
        }

        .forgot-form input::placeholder {
            color: #737d99;
        }

        .forgot-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--gradient-primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .forgot-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.25);
        }

        .forgot-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .forgot-message {
            display: none;
            padding: 13px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        .forgot-message.success {
            display: block;
            color: #86efac;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.25);
        }

        .forgot-message.error {
            display: block;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .forgot-back {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: var(--color-text-muted);
            font-size: 14px;
            transition: 0.3s ease;
        }

        .forgot-back:hover {
            color: var(--color-primary);
        }

        .forgot-footer {
            margin-top: 30px;
            text-align: center;
            color: var(--color-text-muted);
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .forgot-password-card {
                width: 90%;
                padding: 28px 22px;
                margin: 35px auto;
            }

            .forgot-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body class="auth-page">

    <main class="container">

        <div class="forgot-password-card">

            <!-- LOGO -->
            <div class="text-center">
                <a href="../index.html" class="logo">
                    Prac<span>Code</span>
                </a>
            </div>

            <!-- ICON -->
            <div class="forgot-icon">
                🔐
            </div>

            <!-- HEADER -->
            <div class="forgot-header">

                <h1>Forgot Password?</h1>

                <p>
                    Don't worry! It happens. Enter the email address
                    associated with your PracCode account and we'll
                    help you reset your password.
                </p>

            </div>


            <!-- FORGOT PASSWORD FORM -->
            <form id="forgot-password-form" class="forgot-form">

                <div>
                    <label for="forgot-email">Email Address</label>

                    <input
                        type="email"
                        id="forgot-email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- MESSAGE -->
                <div
                    id="forgot-password-message"
                    class="forgot-message"
                    role="status"
                    aria-live="polite">
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="forgot-submit">
                    Send Reset Link →
                </button>

            </form>


            <!-- BACK TO LOGIN -->
            <a href="login.html" class="forgot-back">
                ← Back to Login
            </a>

            <!-- FOOTER -->
            <div class="forgot-footer">
                © <span id="current-year"></span> PracCode.
                All rights reserved.
            </div>

        </div>

    </main>


    <!-- JAVASCRIPT -->
    <script src="../js/authentication.js"></script>

    <script>
        // Display current year
        document.getElementById("current-year").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
